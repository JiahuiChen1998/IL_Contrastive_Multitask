[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "il-property-prediction"
version = "1.0.0"
description = "Supporting code and data for contrastive ionic-liquid property prediction"
requires-python = ">=3.12"
dependencies = ["torch>=2.2", "rdkit==2026.3.6", "numpy==2.5.2", "pandas==3.0.5", "openpyxl==3.1.5", "scipy==1.18.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
tabular = ["tabpfn==8.5.0", "scikit-learn==1.9.0", "kditransform==1.2.0", "requests>=2.32"]

[tool.setuptools.packages.find]
include = ["il_contrastive*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Dataset and results directories live in the repository checkout. Run the
# commands from the cloned repository; the wheel alone is not a data archive.
